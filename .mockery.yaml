# Root mockery configuration for deterministic mock generation
# Pinning to mockery features compatible with v3.5.5
with-expecter: true
keeptree: true
inpackage: false
outpkg: mocks
# Generate mocks for all interfaces under go-app/internal, placing mocks next to their source
# under a local "mocks" package (e.g., go-app/internal/db/mocks, go-app/internal/mlclient/mocks)
packages:
  github.com/umayangag/cric-info-scrapers/go-app/internal/...:
    config:
      all: true
      recursive: true
      # Place generated mocks under <interface dir>/mocks
      dir: "{{.InterfaceDir}}/mocks"
      outpkg: mocks
      with-expecter: true
      keeptree: true
      # Use goimports for formatting to keep imports tidy
      formatter: gofumpt

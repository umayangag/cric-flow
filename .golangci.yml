version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  enable:
    - revive
    # disable testpackage: noisy; we prefer internal tests to access internals
    # - testpackage
    - errcheck
    - staticcheck
    - ineffassign
    - unparam
    - unused
    - gosec
    - gocritic
    - prealloc
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude gosec and unparam in test files (allow math/rand, file perms, and helper signatures)
    - path: ".*_test\\.go$"
      linters:
        - gosec
        - unparam
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

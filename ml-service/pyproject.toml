[tool.black]
line-length = 100
# Optionally, limit to the ml-service package paths
# include = "(app|ml)/"

[tool.isort]
profile = "black"
line_length = 100
# Keep local imports grouping stable; you can tweak as needed
# src_paths = ["app", "ml"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

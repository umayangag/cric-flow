[tool.ruff]
line-length = 120
# Match project runtime
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Pyflakes (F) + isort (I) for import sorting; E501 handled by ruff format
select = ["F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise multiple components together (in-process, no live services)",
    "e2e: end-to-end tests that require live ML service (and optionally go-api); set RUN_E2E=1 to run",
    "runs_real_training: test runs real model training (Optuna/sklearn); exclude with -m 'not runs_real_training' for fast CI",
]
testpaths = ["tests"]
# 4 skipped by default: e2e tests in tests/e2e/test_ml_service_live.py (run with RUN_E2E=1)
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore:.*disp.*iprint.*:DeprecationWarning",
    "ignore:.*Maximum iterations.*:sklearn.exceptions.ConvergenceWarning",
]

[tool.coverage.run]
source = ["app", "ml"]
branch = true
omit = [
  # Nothing. The offline training and tuning CLIs this list excluded were deleted in P-5 and
  # P-6; what replaced them (ml.xi.retrain) is thin enough to be covered by the tests that
  # cover what it calls, so an omit here would only hide the coverage of live code.
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The coverage gate's exit code depends on this. pytest-cov decides pass/fail with
# coverage's should_fail_under, which compares `round(total, precision)` against
# `--cov-fail-under`; coverage's default precision is 0. At precision 0 a real total of
# 94.94% rounded to 95 and cleared a floor of 95, so CI printed
# "FAIL Required test coverage of 95% not reached" and still exited 0 (run 35969830980):
# the ml-service gate could not fail for any total within half a point of the floor.
# Two decimals also make the printed TOTAL row show 94.94% instead of a rounded 95%,
# which is the number the floor must be read from. Do not lower this.
precision = 2

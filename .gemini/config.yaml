# Gemini Code Assist - GitHub integration
# Optimized for single-fetch automation: no inline comments, summary-only

# Code review: output all comments (no limit)
code_review:
  max_review_comments: -1
  comment_severity_threshold: LOW

# Use PR summary as primary communication channel for all PR events
pull_request_opened:
  summary: true
  code_review: true

pull_request_synchronize:
  summary: true
  code_review: true

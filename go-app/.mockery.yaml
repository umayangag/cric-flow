# Mockery configuration for go-app
# Compatible with mockery v2.36+
with-expecter: true
all: false
outpkg: mocks
packages:
  ./internal/adapters/random:
    config:
      output: internal/mocks
    interfaces:
      Random: {}
  ./internal/mlclient:
    config:
      output: internal/mocks
    interfaces:
      Service: {}

# ARCHITECTURE_MAP.md is generated from code and will silently rot otherwise:
#
#   ARCHITECTURE_MAP.md   opens by telling readers to use it *instead of* reading source,
#                         so a stale model shape or endpoint list is inherited by everyone
#                         who trusts it. It drifted to claiming batting took 27 inputs when
#                         the contract said 42, and documenting a /predict/fielding route
#                         that does not exist.
#
#   system-map.json       is drawn as the System map tab, which tells its reader that this
#                         is what the system does. A diagram answers a rename by going
#                         quietly wrong, so the map's anchors are checked against the code
#                         and the code's own enumerations are checked against the map.
#
# The check does not belong in a per-component workflow: it reads from go-app, ml-service and
# configs/ at once, so a path filter scoped to one component would miss changes made in
# another. Hence its own job.
name: Docs consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ARCHITECTURE_MAP.md'
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/gen-architecture-map.py'
      - 'scripts/check-system-map.py'
      - 'ml-service/ml/**'
      - 'ml-service/app/main.py'
      - 'go-app/internal/server/router.go'
      - 'go-app/migrations/**'
      - 'frontend/src/**'
      - 'Makefile'
      - '.github/workflows/docs-consistency.yml'

jobs:
  check:
    if: github.event.pull_request.draft == false
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      # The feature lists are computed by concatenation at import time, so generating the
      # map means importing the ml modules -- which needs their runtime dependencies.
      - name: Install ml-service runtime deps
        run: python -m pip install -r ml-service/requirements.txt

      - name: ARCHITECTURE_MAP.md is up to date
        run: make gen-architecture-map-check

      - name: The system map agrees with the code, in both directions
        run: make check-system-map

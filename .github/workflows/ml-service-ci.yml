name: ML Service CI (Make-driven)

on:
  push:
    branches: [ main ]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'
  pull_request:
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('ml-service/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Run ML Service CI via Make
        run: make -C ml-service ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-coverage
          path: ml-service/coverage.xml

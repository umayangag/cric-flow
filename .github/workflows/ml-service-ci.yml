# Single CI workflow: format/lint check + tests in one job to minimize runners and setup.
name: ML Service CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'ml-service/**'
      - 'scripts/py-reachability.py'
      - '.github/workflows/ml-service-ci.yml'
      - 'Makefile'
      - 'ml-service/requirements.txt'
      - 'ml-service/requirements-serve.in'
      - 'ml-service/requirements-serve.txt'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ml-service/**'
      - 'scripts/py-reachability.py'
      - '.github/workflows/ml-service-ci.yml'
      - 'Makefile'
      - 'ml-service/requirements.txt'
      - 'ml-service/requirements-serve.in'
      - 'ml-service/requirements-serve.txt'

jobs:
  ci:
    if: github.event.pull_request.draft == false
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force 2>/dev/null || true
          docker builder prune -a -f 2>/dev/null || true

      - name: Install deps and tools
        run: make -C ml-service ci-setup

      - name: Format and lint check (ruff)
        run: make -C ml-service fmt-check

      # ruff and pytest both stay quiet about a module nothing imports, because
      # its own tests keep it "used". This walks the import graph instead.
      - name: Reachability (unused modules)
        run: make -C ml-service check-reachability

      - name: Run tests with coverage (xml + term)
        env:
          REQUIREMENTS_FILE: requirements-serve.txt
        run: make -C ml-service coverage

      - name: Enforce coverage threshold
        env:
          # Keep aligned with ml-service/Makefile COV_MIN. Raise together once coverage improves.
          COV_MIN: "81"
          REQUIREMENTS_FILE: requirements-serve.txt
        run: make -C ml-service coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-coverage
          path: ml-service/coverage.xml

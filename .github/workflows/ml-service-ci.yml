name: ML Service CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'
  pull_request:
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'
  issue_comment:
    types: [created]

jobs:
  python:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps via Make (venv + runtime + dev tools)
        run: make -C ml-service ci-setup

      - name: CI (fmt, lint, tests with coverage and threshold)
        env:
          COV_MIN: "80"
        run: make -C ml-service ci

      - name: Validate exports (if present)
        working-directory: ml-service
        run: |
          if ls ../output/go-app/*encoded*.csv >/dev/null 2>&1; then \
            make validate-exports; \
          else \
            echo "No exported CSVs found; skipping export validation."; \
          fi

      - name: Validate inference exports (if present)
        working-directory: ml-service
        run: |
          if ls ../output/go-app/batting_infer_*.csv >/dev/null 2>&1; then \
            make validate-exports-infer; \
          else \
            echo "No inference CSVs found; skipping inference export validation."; \
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-coverage
          path: ml-service/coverage.xml

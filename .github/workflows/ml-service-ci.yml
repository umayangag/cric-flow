name: ML Service CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'
  pull_request:
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
      - 'ml-service/requirements.txt'
  issue_comment:
    types: [created]

jobs:
  python:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ml-service/requirements.txt ]; then pip install -r ml-service/requirements.txt; else pip install -e ml-service; fi
          pip install black isort flake8 ruff

      - name: Lint/format check (isort, black, flake8, ruff)
        working-directory: ml-service
        run: |
          isort --check-only --diff --profile black --line-length 120 .
          black --check --diff --line-length 120 .
          flake8 --max-line-length=120 --extend-ignore=E203,W503 --exclude=.venv
          ruff check --select F401 .

      - name: Sanity compile
        working-directory: ml-service
        run: |
          python -m py_compile app/main.py
          python -m py_compile ml/train_batting_model.py
          python -m py_compile ml/train_bowling_model.py

      - name: Validate exports (if present)
        working-directory: ml-service
        run: |
          if ls ../output/go-app/*encoded*.csv >/dev/null 2>&1; then \
            make validate-exports; \
          else \
            echo "No exported CSVs found; skipping export validation."; \
          fi

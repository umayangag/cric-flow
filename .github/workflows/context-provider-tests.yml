name: Context Provider Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'context-provider/**'
      - '.github/workflows/context-provider-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'context-provider/**'
      - '.github/workflows/context-provider-tests.yml'

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Init (tools + modules)
        run: make -C context-provider init

      - name: Run unit tests with coverage
        run: make -C context-provider coverage

      - name: Enforce coverage threshold
        env:
          COV_MIN: "40"
        run: make -C context-provider coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-provider-coverage
          path: context-provider/coverage.out

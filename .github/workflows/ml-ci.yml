name: ml-service CI (fmt, lint, tests, coverage)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools (black, isort, flake8, ruff, pytest, pytest-cov)
        run: |
          pip install black isort flake8 ruff pytest pytest-cov

      - name: Format check (isort + black)
        run: make fmt-check

      - name: Lint check (ruff minimal + flake8)
        run: make lint-check

      - name: Run tests with coverage (fail under 80%)
        env:
          # Ensure tests don't access network or external paths inadvertently
          PYTHONWARNINGS: default
        run: |
          python -m pytest -q \
            --cov=app --cov=ml \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-coverage
          path: ml-service/coverage.xml

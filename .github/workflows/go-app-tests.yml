name: Go App Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-tests.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-tests.yml'
      - 'go.mod'
      - 'go.sum'

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d cricket_data" 
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Init (tools + modules)
        run: make -C go-app init

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        run: make -C go-app migrate

      - name: Run unit tests with coverage
        run: make -C go-app coverage

      - name: Enforce coverage threshold
        env:
          # Minimum 50%; Makefile default is 80. Raise over time as coverage improves.
          COV_MIN: "50"
        run: make -C go-app coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-app-coverage
          path: go-app/coverage.out

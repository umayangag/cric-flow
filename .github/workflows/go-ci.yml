name: go-app CI (fmt, vet, tests, coverage ≥ 90%)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install tools (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Vet
        working-directory: go-app
        run: make vet

      - name: Format check (gofumpt)
        working-directory: go-app
        run: make fmt-check

      - name: Tests with coverage
        working-directory: go-app
        run: make coverage

      - name: Enforce coverage ≥ 90%
        working-directory: go-app
        run: COV_MIN=90 make coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-app-coverage
          path: go-app/coverage.out

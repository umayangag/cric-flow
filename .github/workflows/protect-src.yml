name: Protect src folder

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'

jobs:
  block-src-changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        run: |
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
          git diff --name-only "origin/${GITHUB_BASE_REF}"..."${GITHUB_SHA}" > changed.txt
          echo "Changed files:" && cat changed.txt || true

      - name: Fail if PR touches src/
        run: |
          if grep -E '^src/' changed.txt; then
            echo 'PR modifies src/ which is read-only' >&2
            exit 1
          else
            echo 'No changes under src/'.
          fi

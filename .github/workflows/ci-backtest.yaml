name: Backtest E2E Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-backtest.yaml'
      - 'docker-compose.yml'
      - 'go-app/**'
      - 'ml-service/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-backtest.yaml'
      - 'docker-compose.yml'
      - 'go-app/**'
      - 'ml-service/**'

env:
  POSTGRES_DB: cricket_data
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_SSLMODE: disable
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  ML_SERVICE_URL: http://localhost:8000
  VITE_API_URL: http://localhost:8080

jobs:
  e2e-smoke:
    if: github.event.pull_request.draft == false
    name: Optional E2E Backtest Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (for migrate-local target)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install system tools (psql, curl, jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client curl jq

      - name: Start Postgres (docker compose)
        run: |
          docker compose up -d postgres

      - name: Seed fixtures (apply migrations + seed SQL)
        run: |
          make seed-fixtures

      - name: Start API and ML services
        run: |
          docker compose up -d go-api ml-service

      - name: Run E2E smoke (select → evaluate)
        run: |
          make e2e-backtest-smoke

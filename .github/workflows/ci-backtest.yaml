name: Backtest CI

on:
  push:
  pull_request:

jobs:
  python-ml:
    name: ML Service (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-service/**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ml-service
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest fastapi uvicorn numpy pandas pydantic
          fi

      - name: Run pytest
        working-directory: ml-service
        run: pytest -q

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Run unit tests
        working-directory: go-app
        run: go test ./...

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run -s build

      - name: Test
        working-directory: frontend
        run: npm -s test

  e2e-smoke:
    name: Optional E2E Backtest Smoke
    runs-on: ubuntu-latest
    if: ${{ env.RUN_E2E_SMOKE == 'true' }}
    env:
      POSTGRES_DB: cricket_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      # Expose these for Makefile targets
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      ML_SERVICE_URL: http://localhost:8000
      VITE_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (for migrate-local target)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install system tools (psql, jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client jq

      - name: Start Postgres (docker compose)
        run: |
          docker compose up -d postgres

      - name: Seed fixtures (apply migrations + seed SQL)
        run: |
          make seed-fixtures

      - name: Start API and ML services
        run: |
          docker compose up -d go-api ml-service

      - name: Run E2E smoke (select → evaluate)
        run: |
          make e2e-backtest-smoke

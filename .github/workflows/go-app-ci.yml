name: Go App CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
  issue_comment:
    types: [created]

jobs:
  go:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d cricket_data" 
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Init via Make (tools + modules)
        run: make -C go-app init

      - name: Vet
        run: make -C go-app vet

      - name: Format check
        run: make -C go-app fmt-check

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        run: make -C go-app migrate

      - name: Build
        run: make -C go-app build

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: go-app
          args: -c ../.golangci.yml

      - name: Coverage (generate)
        run: make -C go-app coverage

      - name: Coverage (enforce >= 80%)
        env:
          COV_MIN: "80"
        run: make -C go-app coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-app-coverage
          path: go-app/coverage.out

# Single CI workflow: lint + tests in one job to minimize runners and setup.
#
# The trigger covers more than go-app/ because the suite reads more than go-app/ (OPS-01).
# `configs/**` holds the team lineage, the wicket-kind vocabulary and the biography
# overrides -- all read by the importer, all parsed here against the committed file -- and
# `reference-data/**` holds venue-geocoding.csv, whose `venue_key` column internal/venues
# holds to NormalizeName (IMPORT-08). Both are data a person edits by hand, so without
# these paths a broken row merged green.
name: Go App CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'go-app/**'
      - 'configs/**'
      - 'reference-data/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'go-app/**'
      - 'configs/**'
      - 'reference-data/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

jobs:
  ci:
    if: github.event.pull_request.draft == false
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          # Named for what it is. The DB integration suites truncate on every fixture and
          # refuse to run against the working database's name (`cricket_data`), which is
          # what kept them out of CI and therefore unrun -- see B-4 in docs/BUG_BACKLOG.md.
          POSTGRES_DB: cricket_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d cricket_flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: go-app/go.sum

      - name: Init (tools + modules)
        run: make -C go-app init

      - name: Format check
        run: make -C go-app fmt-check

      - name: Vet
        run: make -C go-app vet

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in step with GOLANGCI_VERSION in go-app/Makefile.
          version: v2.11.1
          working-directory: go-app
          args: -c ../.golangci.yml
          # The action's config-verify step fetches its JSON schema from
          # golangci-lint.run on every run, and that fetch has been the single
          # largest source of CI flakes here -- three timeouts in one afternoon,
          # each costing a rerun on a PR whose code was fine. It only checks the
          # YAML's shape against a schema; an unknown linter or a malformed
          # setting still fails the lint run itself, which is the check that
          # matters. Trading a network dependency for nothing lost.
          verify: false

      # golangci-lint's `unused` only sees unexported identifiers within a package,
      # so exported-but-uncalled code slips past it. This is whole-program.
      - name: Dead code (unreachable functions)
        run: make -C go-app deadcode

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cricket_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        run: make -C go-app migrate

      - name: Run unit tests with coverage
        run: make -C go-app coverage

      # The database suites are gated behind RUN_DB_TESTS=1 and nothing set it, so five of
      # them had never once executed and had been failing on a not-null constraint since
      # they were written (B-4). This step is what makes them tests rather than text. They
      # truncate, which is why the service database above is a scratch one; `test-db`
      # points POSTGRES_DB at it and the suites refuse any database named cricket_data.
      - name: Run database integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        run: make -C go-app test-db TEST_POSTGRES_DB=cricket_flow_test

      - name: Enforce coverage threshold
        env:
          # Keep aligned with go-app/Makefile COV_MIN (currently 80). Raise together once coverage improves.
          #
          # Raised 76 -> 77 once B-9 was fixed. The total used to sit on the 76.95 boundary
          # with one statement deciding which side of it landed -- `ctxReader.Read`'s
          # cancellation branch, covered on a fast machine and not on this runner, so the
          # same commit measured 77.0 locally and 76.9 here. That branch is asserted
          # deterministically now, and **this runner** measured 77.0 before the threshold
          # moved. The figure the gate applies is the figure the gate measured.
          #
          # Raised 77 -> 78 with P2-4 (the track record): this runner measured 78.6 on
          # PR #283's run 34145895838, the same figure as the local run.
          #
          # Raised 78 -> 79 with P3-2 (the auction projection): this runner measured 79.1
          # on PR #290's run 34275028287, the same figure as the local run.
          #
          # Raised 79 -> 80 with GO-08/GO-09 (the venue and the calendar day): this runner
          # measured 80.0 on PR #332's run 35628399173, the same figure as the local run.
          COV_MIN: "80"
        run: make -C go-app coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-app-coverage
          path: go-app/coverage.out

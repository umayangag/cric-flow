name: Go App CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'
      - 'go.mod'
      - 'go.sum'
  issue_comment:
    types: [created]

jobs:
  go:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d cricket_data" 
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Go formatters (gofumpt, golines)
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/segmentio/golines@latest

      - name: Check formatting (gofumpt)
        working-directory: go-app
        run: |
          # fail if any file would be modified
          diff <(git ls-files | grep '^go-app/.*\.go$' | xargs -I{} bash -lc 'cat {}') <(gofumpt -l -w . >/dev/null 2>&1; git ls-files | grep '^go-app/.*\.go$' | xargs -I{} bash -lc 'cat {}') || (echo "Run make fmt-go locally" && exit 1)
        shell: bash

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        working-directory: go-app
        run: go run ./cmd/tools/migrate -dir=./migrations

      - name: Build
        working-directory: go-app
        run: go build ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go-app
          args: -c ../.golangci.yml

      - name: Test
        working-directory: go-app
        run: go test ./... -v


  gemini-review:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/gemini review') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Gemini PR Review
        uses: actions/github-script@v7
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) {
              core.setFailed('No PR number found in context.');
            }

            // Fetch changed files with patches
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            let totalPatchChars = 0;
            const maxChars = 120000;
            const parts = [];
            // Only consider changes under go-app/
            for (const f of files) {
              if (!f.filename.startsWith('go-app/')) continue;
              const header = `\n--- File: ${f.filename} (${f.status}, +${f.additions} -${f.deletions})`;
              const patch = f.patch || '';
              if (patch.length === 0) continue;
              if (totalPatchChars + header.length + patch.length > maxChars) break;
              parts.push(header + "\n" + patch);
              totalPatchChars += header.length + patch.length;
            }

            if (parts.length === 0) {
              core.info('No patch data available to review.');
              return;
            }

            const diffText = parts.join('\n');

            const systemPrompt = `You are a senior Go engineer reviewing a pull request for the go-app of a monorepo. Provide a concise, actionable review:\n- Identify logic bugs, data races, panics, nil dereferences, SQL issues, and concurrency pitfalls.\n- Call out style issues aligned with gofumpt/golangci-lint and idiomatic Go.\n- Suggest performance or memory improvements.\n- Recommend tests or docs updates.\n- Keep it focused on changed lines. Use bullet points. Include minimal code snippets when helpful.`;

            const userPrompt = `Repository: ${context.repo.owner}/${context.repo.repo}\nPR #${prNumber}\nChanged patches (unified diff format):\n\n${diffText}`;

            const body = {
              contents: [
                { role: 'user', parts: [{ text: systemPrompt }] },
                { role: 'user', parts: [{ text: userPrompt }] },
              ],
            };

            const apiKey = process.env.GOOGLE_API_KEY;
            if (!apiKey) {
              core.setFailed('Missing GOOGLE_API_KEY secret. Please add it in repository settings.');
            }

            const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!res.ok) {
              const txt = await res.text();
              core.setFailed(`Gemini API request failed: ${res.status} ${res.statusText} - ${txt}`);
            }

            const data = await res.json();
            let review = 'No response.';
            try {
              review = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n') || review;
            } catch (e) { /* ignore */ }

            const finalComment = `🤖 Gemini PR Review (go-app)\n\n${review}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: finalComment,
            });

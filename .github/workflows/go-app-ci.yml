name: go-app CI

on:
  pull_request:
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'
  push:
    branches: [ '**' ]
    paths:
      - 'go-app/**'
      - '.github/workflows/go-app-ci.yml'

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Go module download
        run: go mod download

      - name: Install tools (gofumpt, golines, golangci-lint)
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/segmentio/golines@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Format check
        run: |
          make fmt-check || (echo "Formatting issues found (CI shows them)." && exit 1)

      - name: Lint
        run: |
          make lint

      - name: Unit tests
        run: |
          make test

      - name: Coverage (informational gate)
        env:
          # Curated scope to reflect actively maintained/tested packages; expand over time
          COVERAGE_PACKAGES: |
            ./internal/cli/... ./internal/commands/... ./internal/services/... \
            ./internal/adapters/httpx/... ./internal/adapters/clock/... ./internal/adapters/random/... \
            ./internal/logger ./internal/config ./internal/mlclient ./internal/predictor
          COV_MIN: 50
        run: |
          make coverage
          make coverage-func
          # Do not fail PRs under 50 globally; apply minimum 50%
          make coverage-check COV_MIN=${COV_MIN}

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-app-coverage
          path: go-app/coverage.out
          if-no-files-found: warn

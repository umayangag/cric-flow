name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d cricket_data" 
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Go mod tidy
        working-directory: go-app
        run: go mod tidy

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cricket_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSLMODE: disable
        working-directory: go-app
        run: go run ./cmd/tools/migrate -dir=./migrations

      - name: Go build
        working-directory: go-app
        run: go build ./...

      - name: Go tests
        working-directory: go-app
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python sanity (compile ML service)
        working-directory: ml-service
        run: |
          python -m py_compile app/main.py
          python -m py_compile ml/train_batting.py
          python -m py_compile ml/train_bowling.py

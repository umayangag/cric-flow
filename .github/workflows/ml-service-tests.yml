name: ML Service Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-tests.yml'
      - 'ml-service/requirements.txt'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-tests.yml'
      - 'ml-service/requirements.txt'

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps and tools
        run: make -C ml-service ci-setup

      - name: Run tests with coverage (xml + term)
        run: make -C ml-service coverage

      - name: Enforce coverage threshold
        env:
          # Raise over time; Makefile default 76. Current ~76.4%.
          COV_MIN: "76"
        run: make -C ml-service coverage-check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-coverage
          path: ml-service/coverage.xml

services:
  postgres:
    image: postgres:15-alpine
    container_name: cricket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-api:
    build:
      context: ./go-app
      dockerfile: Dockerfile.api
    image: umayangag/cric-app-api:latest
    container_name: cric-go-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      API_KEY: ${API_KEY:-dev-local-key}
      MIGRATIONS_DIR: /migrations
      PORT: 8080
      ML_SERVICE_URL: http://ml-service:8000
      # Export dir for pipeline export-dataset (must be writable in container; mount ./output below).
      GO_APP_OUTPUT_DIR: /output/go-app
      # Go runtime memory target. If unset, Go uses the container's cgroup memory limit and pipelines auto-size to ~80% of it.
      # Set GOMEMLIMIT in .env only when you want to override that (e.g. GOMEMLIMIT=8GiB on a big host).
      GOMEMLIMIT: ${GOMEMLIMIT:-}
      # Pipeline concurrency (workers). For multiple formats, precompute uses a global worker pool. Seqcalc also runs calculators in parallel.
      # Set in .env to override (e.g. PRECOMPUTE_CONCURRENCY=24 or SEQCALC_CONCURRENCY=4).
      PRECOMPUTE_CONCURRENCY: ${PRECOMPUTE_CONCURRENCY:-24}
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-}
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-}
      FIELDING_CONCURRENCY: ${FIELDING_CONCURRENCY:-}
      SEQCALC_CONCURRENCY: ${SEQCALC_CONCURRENCY:-4}
      # Optional: log memory stats to diagnose OOM. Set e.g. MEM_STATS_INTERVAL=30s or 1m to see heap growth (see docs/quality-and-debugging.md)
      MEM_STATS_INTERVAL: ${MEM_STATS_INTERVAL:-}
      # Error (red) and warn (yellow) in docker logs for visibility
      LOG_COLOR: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./output:/output

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    image: umayangag/cric-app-ml:latest
    container_name: cric-ml-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      PORT: 8000
      MODELS_DIR: /app/output/ml-service
      # Where training subprocess writes artifacts (must match MODELS_DIR so /admin/train/* persists to volume)
      ML_SERVICE_OUTPUT_DIR: /app/output/ml-service
      # Where to read exported CSVs for /admin/train/* (batting, bowling)
      GO_APP_OUTPUT_DIR: /app/output/go-app
      # Required for train-on-the-fly and fielding training from go-app API
      GO_APP_URL: ${GO_APP_URL:-http://go-api:8080}
      # Enable /admin/reload and /admin/train/* when running from frontend pipeline
      ENABLE_HOT_RELOAD: ${ENABLE_HOT_RELOAD:-1}
      # Max concurrent training jobs (default 4 for ~12 CPUs; adjust for your machine)
      MAX_CONCURRENT_TRAINING_JOBS: ${MAX_CONCURRENT_TRAINING_JOBS:-4}
      # Require X-API-Key for /admin/* when set; default to API_KEY so admin is protected by default
      ADMIN_API_KEY: ${ADMIN_API_KEY:-${API_KEY:-dev-local-key}}
      GO_APP_API_KEY: ${API_KEY:-dev-local-key}
      # Resource limit for n_jobs; when unset, ML uses detected cgroup memory (80% fraction) to choose n_jobs automatically.
      # Set ML_MEMORY_LIMIT_MB in .env only when you want to cap ML memory explicitly.
      ML_MEMORY_LIMIT_MB: ${ML_MEMORY_LIMIT_MB:-}
      # Error (red) and warn (yellow) in docker logs for visibility
      LOG_COLOR: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output

  # Watcher: monitors go-api and ml-service for crashes, OOM, and logs diagnostics. See docs/quality-and-debugging.md.
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    image: cric-watcher:latest
    container_name: cric-watcher
    depends_on:
      - go-api
      - ml-service
    environment:
      # Comma-separated list; default monitors both. Legacy: WATCH_CONTAINER for single container.
      WATCH_CONTAINERS: ${WATCH_CONTAINERS:-cric-go-api,cric-ml-service}
      # Optional: persist to volume
      WATCH_LOG: ${WATCH_LOG:-}
      # Last N log lines to capture on crash (default 50)
      WATCH_TAIL_LOGS: ${WATCH_TAIL_LOGS:-50}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watcher-logs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  watcher-logs:

services:
  postgres:
    image: postgres:15-alpine
    container_name: cricket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound the blast radius: without a limit every container shares the whole Docker VM,
    # so a pipeline or training run can exhaust it and the kernel picks the victim by score.
    # Postgres is the fattest resident and therefore the most likely victim, so cap what it
    # can grow into and tell the OOM killer to look elsewhere first. Page cache inside the
    # cgroup is reclaimable, so reaching the cap costs cache hits, not a kill.
    mem_limit: ${POSTGRES_MEM_LIMIT:-3g}
    oom_score_adj: -500
    restart: unless-stopped

  go-api:
    build:
      context: ./go-app
      dockerfile: Dockerfile.api
    image: umayangag/cric-app-api:latest
    container_name: cric-go-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      API_KEY: ${API_KEY:-dev-local-key}
      MIGRATIONS_DIR: /migrations
      PORT: 8080
      ML_SERVICE_URL: http://ml-service:8000
      # go-app's own output dir (resource observations); must be writable in the
      # container, so ./output is mounted below.
      GO_APP_OUTPUT_DIR: /output/go-app
      # Dataset dir Import reads and the acquire step downloads into (must be writable
      # in container; mount ./data below). Absolute so it does not depend on the cwd.
      GO_APP_CRICSHEET_DIR: /data/go-app/cricsheet
      # Reviewed franchise renames (I-4). The build context is ./go-app, so this cannot be
      # baked into the image the way config.json is; it is mounted below. Absolute so the
      # importer does not have to find it by searching upwards from the cwd.
      GO_APP_TEAM_LINEAGE: /configs/team_lineage.json
      # The wicket-kind vocabulary (IMPORT-06), mounted the same way; unlike the lineage
      # the importer refuses to run without it.
      GO_APP_WICKET_KINDS: /configs/wicket_kinds.json
      # Go runtime memory target. If unset, Go uses the container's cgroup memory limit and pipelines auto-size to ~80% of it.
      # Set GOMEMLIMIT in .env only when you want to override that (e.g. GOMEMLIMIT=8GiB on a big host).
      GOMEMLIMIT: ${GOMEMLIMIT:-}
      # Import concurrency (workers). If unset, it is derived automatically from
      # GOMEMLIMIT / cgroup memory and CPU. Set in .env only to override auto-detection.
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-}
      # Optional: log memory stats to diagnose OOM. Set e.g. MEM_STATS_INTERVAL=30s or 1m to see heap growth (see docs/quality-and-debugging.md)
      MEM_STATS_INTERVAL: ${MEM_STATS_INTERVAL:-}
      # Error (red) and warn (yellow) in docker logs for visibility
      LOG_COLOR: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./output:/output
      - ./data:/data
      - ./configs:/configs:ro
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
      args:
        # The commit the image is built from. The Makefile exports it from the checkout;
        # a build outside make leaves it empty and a run built in this image then records
        # its commit as `unknown` rather than as a blank (EVAL-12).
        GIT_SHA: ${GIT_SHA:-}
    image: umayangag/cric-app-ml:latest
    container_name: cric-ml-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      PORT: 8000
      MODELS_DIR: /app/output/ml-service
      # Where retrain writes runs/<id>/ (must match MODELS_DIR so a run persists to the volume)
      ML_SERVICE_OUTPUT_DIR: /app/output/ml-service
      # Enable /admin/reload and /admin/train/* when running from frontend pipeline
      ENABLE_HOT_RELOAD: ${ENABLE_HOT_RELOAD:-1}
      # Require X-API-Key for /admin/* when set; default to API_KEY so admin is protected by default
      ADMIN_API_KEY: ${ADMIN_API_KEY:-${API_KEY:-dev-local-key}}
      # H-11: a live prediction against ratings older than this is refused with RATINGS_STALE.
      XI_RATINGS_MAX_AGE_DAYS: ${XI_RATINGS_MAX_AGE_DAYS:-14}
      # The wicket-kind vocabulary the rating pass classifies wickets by (IMPORT-06);
      # a pass run through /admin/train/* needs it as the host's does.
      GO_APP_WICKET_KINDS: /configs/wicket_kinds.json
      # Error (red) and warn (yellow) in docker logs for visibility
      LOG_COLOR: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./configs:/configs:ro
    restart: unless-stopped

  # Watcher: monitors go-api, ml-service and postgres for crashes, OOM, and logs diagnostics. See docs/quality-and-debugging.md.
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    image: cric-watcher:latest
    container_name: cric-watcher
    depends_on:
      - go-api
      - ml-service
    environment:
      # Comma-separated list. Postgres is included because it is the likeliest OOM victim of
      # an allocation it did not make. Legacy: WATCH_CONTAINER for single container.
      WATCH_CONTAINERS: ${WATCH_CONTAINERS:-cric-go-api,cric-ml-service,cricket-postgres}
      # Optional: persist to volume
      WATCH_LOG: ${WATCH_LOG:-}
      # Last N log lines to capture on crash (default 50)
      WATCH_TAIL_LOGS: ${WATCH_TAIL_LOGS:-50}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watcher-logs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  watcher-logs:

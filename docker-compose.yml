services:
  postgres:
    image: postgres:15-alpine
    container_name: cricket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-api:
    build:
      context: ./go-app
      dockerfile: Dockerfile.api
    image: umayangag/cric-app-api:latest
    container_name: cric-go-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      API_KEY: ${API_KEY:-dev-local-key}
      MIGRATIONS_DIR: /migrations
      PORT: 8080
      ML_SERVICE_URL: http://ml-service:8000
      # Optional: log memory stats every 5m to diagnose OOM (see docs/CRASH_DIAGNOSIS.md)
      MEM_STATS_INTERVAL: ${MEM_STATS_INTERVAL:-}
    ports:
      - "8080:8080"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: umayangag/cric-app-ml:latest
    container_name: cric-ml-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cricket_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: disable
      PORT: 8000
      MODELS_DIR: /app/output/ml-service
      # Required for train-on-the-fly when no artifacts are loaded for a format (e.g. T20I)
      GO_APP_URL: ${GO_APP_URL:-http://go-api:8080}
      GO_APP_API_KEY: ${API_KEY:-dev-local-key}
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output

  # Watcher: logs go-api (and optionally other) container exit code and OOM status. See docs/CRASH_DIAGNOSIS.md.
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    image: cric-watcher:latest
    container_name: cric-watcher
    depends_on:
      - go-api
    environment:
      WATCH_CONTAINER: ${WATCH_CONTAINER:-cric-go-api}
      # Optional: set WATCH_LOG=/logs/watcher.log to persist to watcher-logs volume
      WATCH_LOG: ${WATCH_LOG:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watcher-logs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  watcher-logs:
